name: Build FanchmWrt for WNDR4300

on:
  workflow_dispatch:
  schedule:
    - cron: 0 17 * * 0

env:
  # 源码仓库与分支（FanchmWrt）
  OPENWRT_REPO: fanchmwrt/fanchmwrt
  OPENWRT_BRANCH: fanchmwrt-25.12.4
  # 编译产物上传保留天数
  UPLOAD_RELEASE: false
  UPLOAD_FIRMWARE: true
  FIRMWARE_TAG: FanchmWrt-WNDR4300

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Clone source code
        run: |
          git clone --depth 1 --branch $OPENWRT_BRANCH https://github.com/$OPENWRT_REPO.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom .config
        run: |
          cp -f .config openwrt/.config
          cd openwrt
          make defconfig

      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s

      - name: Organize firmware files
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload firmware to artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ env.FIRMWARE_TAG }}
          path: ${{ env.FIRMWARE }}
          retention-days: 7
